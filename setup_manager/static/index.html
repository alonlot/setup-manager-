<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Setup Manager</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234f8cff'/%3E%3Cpath d='M12 4v11M8 8l4-4 4 4M7 13v3h10v-3M10 19h4' stroke='white' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/vendor/xterm.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">
      <span class="logo">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4M6 13v4h12v-4M10 21h4"/></svg>
      </span>
      <span>Setup Manager</span>
    </a>
    <form class="search" id="search-form" autocomplete="off">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Find a USB device on all setups (name, vid:pid, serial, tty)">
    </form>
    <div class="top-actions">
      <button class="btn ghost" id="btn-local" title="Devices attached to this PC">
        <span class="dot purple"></span> <span id="local-count">0</span> attached here
      </button>
      <button class="btn ghost" id="btn-discover">Scan network</button>
      <button class="btn primary" id="btn-add">+ Add setup</button>
      <button class="btn icon ghost" id="btn-theme" title="Toggle theme">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <a class="nav-item" href="#/" data-nav="overview">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Overview
      </a>
      <a class="nav-item" href="#/run" data-nav="run">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="m4 17 6-6-6-6M12 19h8"/></svg>
        Run on many
      </a>
      <div class="side-title">Setups <span id="side-count" class="muted"></span></div>
      <div id="setup-list" class="setup-list"></div>
    </aside>
    <main id="main" class="main"></main>
  </div>

  <div id="term-pool" hidden></div>
  <div id="modal-root"></div>
  <div id="toasts" class="toasts"></div>

  <script src="/static/vendor/xterm.js"></script>
  <script src="/static/vendor/addon-fit.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
